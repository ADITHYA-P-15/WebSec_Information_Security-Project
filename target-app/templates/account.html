<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Review your Northstar Supply account and recent orders."><title>Your account: Northstar Supply</title><link rel="stylesheet" href="/static/store.css"></head>
<body><header class="masthead"><a class="wordmark" href="/">Northstar Supply</a><nav aria-label="Account navigation"><a href="/#shop">Shop</a><a href="/#account">Your account</a></nav></header>
<main class="page"><section class="customer-section account-page"><h1>Your account</h1><p class="section-intro">Welcome, {{ username }}.</p><p>Account type: {{ role }}</p><div class="account-links"><a href="/orders">View your orders</a><a href="/profile">Profile details</a><a href="/logout">Sign out</a></div><div id="orders" class="order-list"></div></section></main>
<script>fetch('/orders').then(r=>r.ok?r.json():[]).then(items=>{const list=document.getElementById('orders');for(const order of items){const row=document.createElement('div');row.className='order-row';row.textContent='Order #'+order.id+' / '+order.product+' / $'+Number(order.amount).toFixed(2);list.append(row)}})</script></body></html>
