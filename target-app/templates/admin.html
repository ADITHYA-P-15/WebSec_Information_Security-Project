<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Northstar Supply order and customer operations."><title>Store operations — Northstar Supply</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/store.css"></head>
<body><header class="masthead"><a class="wordmark" href="/">Northstar Supply</a><nav aria-label="Operations navigation"><a href="/#shop">Shop</a><a href="/#account">Account</a></nav></header><main class="page">
<section class="opening operations-opening"><div class="opening-copy"><h1>Store operations</h1><p class="lead">Order totals, customer access, and review moderation.</p></div><div class="feature-offer"><h2>Order summary</h2><p id="orders" class="operation-value">Loading order summary…</p></div></section>
<section class="operations-section"><h2>Customer accounts</h2><p id="customer-status" class="status" aria-live="polite">Loading customer records…</p><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Account type</th></tr></thead><tbody id="customers"></tbody></table></div></section>
<section class="operations-section"><h2>Recent reviews</h2><p class="section-intro">Remove a review that no longer belongs in the store.</p><p id="review-status" class="status" aria-live="polite"></p><div id="reviews" class="order-list"></div></section></main>
<script>
fetch('/api/admin/reports').then(async response=>{const target=document.getElementById('orders');if(!response.ok){target.textContent='Order totals are available to store administrators.';return}const data=await response.json();target.textContent=data.total_orders+' orders / $'+Number(data.total_revenue).toFixed(2)+' in demo sales'});
fetch('/admin/lab/users').then(async response=>{const target=document.getElementById('customers');if(!response.ok){document.getElementById('customer-status').textContent='Customer list unavailable.';return}const people=await response.json();for(const person of people){const row=document.createElement('tr');const name=document.createElement('td');name.textContent=person.username;const role=document.createElement('td');role.textContent=person.role;row.append(name,role);target.append(row)}document.getElementById('customer-status').textContent='Customer accounts in the store database.'}).catch(()=>document.getElementById('customer-status').textContent='Customer list unavailable.');
async function loadReviews(){const response=await fetch('/admin/reviews');const target=document.getElementById('reviews');target.replaceChildren();if(!response.ok){document.getElementById('review-status').textContent='Review moderation is available to store administrators.';return}for(const review of await response.json()){const row=document.createElement('div');row.className='order-row';const body=document.createElement('span');body.textContent=review.body;const remove=document.createElement('button');remove.className='button button-outline';remove.textContent='Remove';remove.addEventListener('click',async()=>{const result=await fetch('/admin/reviews/'+review.id,{method:'DELETE'});if(result.ok)loadReviews()});row.append(body,remove);target.append(row)}if(!target.children.length)document.getElementById('review-status').textContent='There are no reviews to moderate.'}
loadReviews();
</script></body></html>
