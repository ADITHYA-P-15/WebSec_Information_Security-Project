<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to manage your Northstar Supply account and orders."><title>Sign in: Northstar Supply</title><link rel="stylesheet" href="/static/store.css"></head>
<body><header class="masthead"><a class="wordmark" href="/">Northstar Supply</a><nav aria-label="Store navigation"><a href="/">Shop</a><a href="/#reviews">Reviews</a></nav></header>
<main class="page"><section class="customer-section account-page"><h1>Sign in</h1><p class="section-intro">Access your account and orders.</p>{% if error %}<p class="status" role="alert">{{ error }}</p>{% endif %}<form action="/login" method="post" class="account-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button">Sign in</button></form></section></main></body></html>
