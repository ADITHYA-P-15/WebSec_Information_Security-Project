<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Run and review a local web application security assessment.">
  <title>Assessment desk: Web application security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <header class="app-header"><a class="wordmark" href="/">Assessment desk</a><a class="store-link" href="http://localhost:5001/">Open Northstar Supply</a></header>
  <main class="app-shell">
    <section class="run-panel" aria-labelledby="run-heading"><div><h1 id="run-heading">Run an assessment</h1><p>Assess the local Northstar Supply application and build an evidence-backed report.</p></div>
      <form class="run-form" method="post" action="/run-assessment"><label for="target-url">Target URL</label><div class="run-controls"><input id="target-url" name="target_url" value="%%TARGET_URL%%" required><button class="button">Run assessment</button></div></form>
    </section>
    <div id="assessment-content">%%CONTENT%%</div>
    <section class="history-panel"><h2>Assessment history</h2><nav aria-label="Assessment history">%%HISTORY%%</nav></section>
    <footer class="app-footer">Candidate findings need evidence review. Risk scores are project-specific and are not CVSS.</footer>
  </main>
</body>
</html>
